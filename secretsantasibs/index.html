<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0000ff">
<title>Secret Santa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230000ff'/%3E%3Ctext x='16' y='27' font-size='28' text-anchor='middle' fill='white' font-family='monospace'%3E*%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0000ff;
  --white:#ffffff;
  --pale:#ccccff;
  --sans:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(16px,2.4vw,32px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--white);color:var(--blue);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100svh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--white);border:1px solid var(--blue);border-radius:0}
a{color:inherit}
[hidden]{display:none!important}
::selection{background:var(--blue);color:var(--white)}

.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.box{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--blue);padding:9px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-decoration:none;color:var(--blue);line-height:1}
.box.solid,.box:hover{background:var(--blue);color:var(--white)}
.wide{font-stretch:125%;font-variation-settings:"wdth" 125}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;padding:var(--pad);z-index:40;pointer-events:none}
.bar>*{pointer-events:auto}
.logo{background:var(--white);padding:9px 11px;font-size:15px;font-weight:500;text-decoration:none;letter-spacing:-.01em}
.logo b{font-weight:800}
.ctrls{display:flex}
.ctrls .box+.box{border-left:0}

/* home */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;cursor:crosshair}
#field{position:absolute;inset:0;width:100%;height:100%;display:block}
.tags{position:absolute;left:var(--pad);top:calc(var(--pad) + 56px);display:flex;flex-wrap:wrap;pointer-events:none}
.tags span{background:var(--white);padding:8px 10px}
.tags span+span{background:var(--blue);color:var(--white)}
.words{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);pointer-events:none}
.word{display:block;width:max-content;background:var(--white);font-weight:850;font-size:clamp(76px,16.5vw,250px);line-height:.8;letter-spacing:-.035em;padding:.08em .09em .12em}
.word.w1{margin-left:2vw}
.word.w2{margin-left:9vw;margin-top:-2px}
.note{position:absolute;right:var(--pad);top:24%;width:min(330px,40vw);pointer-events:none}
.note p{background:var(--white);padding:16px 18px;font-size:17px;line-height:1.3;letter-spacing:-.005em}
.note .mono{display:inline-block;margin-top:14px;background:var(--white);padding:7px 9px;font-size:10px}
.go{position:absolute;right:var(--pad);bottom:var(--pad);display:flex;flex-direction:column;align-items:stretch;min-width:min(380px,calc(100vw - 2*var(--pad)))}
.go a{display:flex;justify-content:space-between;align-items:baseline;gap:18px;background:var(--white);border:1px solid var(--blue);padding:16px 18px;text-decoration:none}
.go a+a{border-top:0}
.go a:hover{background:var(--blue);color:var(--white)}
.go .t{font-weight:800;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.02em;line-height:1}
@media (max-width:720px){
  .note{display:none}
  .words{top:44%}
  .word{font-size:23vw}
  .word.w2{margin-left:6vw}
}

/* pages */
.page{min-height:100svh;padding:calc(var(--pad) + 80px) var(--pad) calc(var(--pad) + 40px)}
.kicker{margin-bottom:22px}
.big{font-weight:850;font-size:clamp(48px,9vw,140px);line-height:.86;letter-spacing:-.035em}

/* pick */
.names{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(28px,5vw,60px);border-left:1px solid var(--blue);border-top:1px solid var(--blue)}
.names button{border:0;border-right:1px solid var(--blue);border-bottom:1px solid var(--blue);padding:clamp(18px,3vw,34px) 18px;text-align:left;display:flex;flex-direction:column;gap:14px}
.names button .n{font-weight:800;font-size:clamp(30px,5vw,68px);letter-spacing:-.03em;line-height:.9}
.names button:hover{background:var(--blue);color:var(--white)}
.pick .foot{margin-top:22px}
@media (max-width:620px){.names{grid-template-columns:repeat(2,1fr)}}
.again{max-width:760px}
.again p{font-size:20px;line-height:1.35;margin:26px 0 30px;max-width:30em}
.again .row{display:flex;flex-wrap:wrap;gap:0;margin-top:clamp(28px,5vw,60px)}
.again .row .box{padding:16px 18px;font-size:13px}
.again .row .box+.box{border-left:0}

/* game */
.game{position:fixed;inset:0;z-index:30;background:var(--white);touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.cap{position:absolute;left:var(--pad);top:calc(var(--pad) + 56px);max-width:min(460px,calc(100vw - 2*var(--pad)));background:var(--white);border:1px solid var(--blue);padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.45;letter-spacing:.04em;transition:opacity .25s}
.cap:empty{display:none}
.hud{position:absolute;right:var(--pad);bottom:var(--pad);display:flex;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.hud span{background:var(--white);border:1px solid var(--blue);padding:9px 12px}
.hud span+span{border-left:0}
.hud span.solid{background:var(--blue);color:var(--white)}
.skip{position:absolute;left:var(--pad);bottom:var(--pad)}
.reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 6vw}
.reveal .r1,.reveal .r2,.reveal .r3{opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .7s ease}
.reveal.on .r1,.reveal.on .r2,.reveal.on .r3{opacity:1;transform:none}
.reveal.on .r2{transition-delay:.6s}
.reveal.on .r3{transition-delay:1.5s}
.reveal .r1{font-weight:800;font-size:min(7.2vw,7.2vh);letter-spacing:-.02em;line-height:1}
.reveal .r2{font-family:var(--mono);font-size:min(2.6vw,2.6vh,15px);letter-spacing:.18em;text-transform:uppercase;margin:min(2.6vw,2.6vh) 0 min(1.4vw,1.4vh)}
.reveal .r3{font-weight:900;font-size:min(13vw,13vh);letter-spacing:-.04em;line-height:.9}
.after{position:absolute;left:0;right:0;bottom:var(--pad);display:flex;justify-content:center;opacity:0;transition:opacity .6s 2.6s}
.after.on{opacity:1}
.after .box{padding:14px 16px}
.after .box+.box{border-left:0}
.after .box.solid{border-color:var(--white)}

/* lists */
.lists .sub{margin-top:24px;max-width:46em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));margin-top:clamp(30px,5vw,56px);border-left:1px solid var(--blue);border-top:1px solid var(--blue)}
.card{border-right:1px solid var(--blue);border-bottom:1px solid var(--blue);display:flex;flex-direction:column;min-height:380px}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:28px 26px 24px}
.card h2{font-weight:850;font-size:clamp(40px,4.4vw,60px);letter-spacing:-.035em;line-height:.9}
.card ul{list-style:none;flex:1;border-top:1px solid var(--pale)}
.card li{display:grid;grid-template-columns:1fr 30px;align-items:start;gap:12px;padding:18px 18px 18px 26px;border-bottom:1px solid var(--pale);font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.card li a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.card li a:hover{background:var(--blue);color:var(--white);text-decoration:none}
.card li .x{border:0;background:none;font-family:var(--mono);font-size:15px;line-height:1;padding:4px;opacity:.35}
.card li:hover .x{opacity:1}
.card li .x:hover{background:var(--blue);color:var(--white)}
.card .empty{padding:18px 26px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.55}
.card form{display:flex;border-top:1px solid var(--blue)}
.card input{flex:1;min-width:0;border:0;padding:18px 26px;font-size:16px;background:var(--white);outline:none}
.card input::placeholder{color:var(--blue);opacity:.45}
.card form button{border:0;border-left:1px solid var(--blue);padding:0 22px;font-family:var(--mono);font-size:12px;letter-spacing:.1em}
.card form button:hover{background:var(--blue);color:var(--white)}
.status{margin-top:18px}
</style>
</head>
<body>

<div class="bar">
  <a class="logo wide" href="#/">secret<b>Santa</b></a>
  <div class="ctrls" id="ctrls">
    <button class="box" id="glyphBtn" title="Change the symbols">* / ^</button>

<!-- HOME -->
<main data-view="home">
  <section class="hero" id="hero">

    </div>

      <a href="#/draw"><span class="mono">01</span><span class="t wide">The draw</span><span class="mono">→</span></a>

    </nav>

</main>

<!-- DRAW -->
<main data-view="draw" hidden>
  <section class="page pick" id="pick">
    <p class="mono kicker">01 / 02 · The draw</p>
    <h1 class="big wide">Who are you?</h1>
    <div class="names" id="names"></div>
  </section>

  <section class="page again" id="again" hidden>
    <p class="mono kicker">01 / 02 · The draw</p>
    <h1 class="big wide" id="againTitle">Hello again.</h1>
    <div class="row">
      <button class="box solid" id="againShow">Show me my bauble</button>

</main>

<!-- LISTS -->
<main data-view="lists" hidden>
  <section class="page lists">
    <p class="mono kicker">02 / 02 · The lists</p>
    <h1 class="big wide">The lists</h1>
    <p class="mono status" id="status"></p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
/* ---------- settings ---------- */
const SUPABASE_URL = 'https://wrmsjmzytoarvomtonoq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2vwrTh38JNgj95bhX8A1_w_zcZqdZUi';
const TABLE = 'secretsanta_sibs_wishes';

const PEOPLE = ['James','Ruth','Matt','Steph','Josh','Juliette'];
/* The draw. Made once, one loop, no partners. Scrambled so nobody reads it by accident. */
const DRAW = 'Fks5AQAMERsRSENURmcWBAsWT0VRPg0IERxHF0M9EEgHAUxJTzoHERwNVlVHfxQaDA9bSzwQGQFRTk4vGxwND01MLkIEAUxfTyQSABhHWE0oTBUaRhdVIxsJBAwHAAlHCQ==';
function drawFor(name){
  const k = 'mistletoe-and-wine', raw = atob(DRAW);
  let s = ''; for (let i = 0; i < raw.length; i++) s += String.fromCharCode(raw.charCodeAt(i) ^ k.charCodeAt(i % k.length));
  return JSON.parse(s)[name];
}

const $ = (q, el = document) => el.querySelector(q);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const store = {
  get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
  set(k, v){ try { localStorage.setItem(k, v) } catch(e){} },
  del(k){ try { localStorage.removeItem(k) } catch(e){} }
};

/* ---------- the field ---------- */
const Field = (() => {
  const cv = $('#field'), ctx = cv.getContext('2d');
  const sets = [['*','^'],['+','-'],['0','1']];
  let w, h, dpr, cell, cols, rows, a, gi = 0, paused = false, running = false, n = 0, waves = [], lastStep = 0, dirty = true;
  function resize(){
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    w = r.width; h = r.height; dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cell = w < 700 ? 24 : 32; cols = Math.ceil(w / cell) + 1; rows = Math.ceil(h / cell) + 1;
    a = new Uint8Array(cols * rows);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() < .5 ? 1 : 0;
    for (let k = 0; k < 7; k++) smooth(1);
    dirty = true;
  }
  function smooth(p){
    const o = new Uint8Array(a.length);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
      const i = y*cols + x;
      if (Math.random() > p){ o[i] = a[i]; continue; }
      let s = 0, c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const xx = x+dx, yy = y+dy; if (xx < 0 || yy < 0 || xx >= cols || yy >= rows) continue; s += a[yy*cols+xx]; c++;
      }
      o[i] = s*2 > c ? 1 : s*2 < c ? 0 : a[i];
    }
    a = o;
  }
  function step(){
    n++;
    if (n % 2 === 0){
      for (let y = 0; y < rows; y++){
        for (let x = cols - 1; x > 0; x--) a[y*cols+x] = a[y*cols+x-1];
        const up = y ? a[(y-1)*cols] : a[1];
        a[y*cols] = Math.random() < .8 ? (Math.random() < .5 ? up : a[y*cols+1]) : 1 - a[y*cols+1];
      }
    }
    for (let i = 0; i < a.length * .003; i++) a[(Math.random()*a.length)|0] ^= 1;
    smooth(.2);
    dirty = true;
  }
  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#0000ff';
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (a[y*cols+x]) ctx.fillRect(x*cell, y*cell, cell+.5, cell+.5);
    ctx.font = `500 ${cell < 30 ? 11 : 13}px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const [g1, g0] = sets[gi];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
      const on = a[y*cols+x];
      ctx.fillStyle = on ? '#fff' : '#0000ff';
      ctx.fillText(on ? g1 : g0, x*cell + cell/2, y*cell + cell/2 + 1);
    }
  }
  function loop(t){
    if (!running) return;
    if (!paused && t - lastStep > 150){ lastStep = t; step(); }
    if (waves.length){
      for (const wv of waves){
        wv.r += .45;
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
          const d = Math.hypot(x - wv.x, y - wv.y);
          if (d <= wv.r && d > wv.r - .45) a[y*cols+x] ^= 1;
        }
      }
      waves = waves.filter(wv => wv.r < Math.hypot(cols, rows));
      dirty = true;
    }
    if (dirty){ render(); dirty = false; }
    requestAnimationFrame(loop);
  }
  $('#hero').addEventListener('pointerdown', e => {
    if (e.target.closest('a,button')) return;
    const r = cv.getBoundingClientRect();
    waves.push({ x: (e.clientX - r.left) / cell, y: (e.clientY - r.top) / cell, r: 0 });
  });
  $('#glyphBtn').onclick = () => { gi = (gi + 1) % sets.length; $('#glyphBtn').textContent = sets[gi].join(' / '); dirty = true; };
  $('#pauseBtn').onclick = () => { paused = !paused; $('#pauseBtn').textContent = paused ? '▶ play' : '❚❚ pause'; };
  addEventListener('resize', () => { if (running) resize(); });
  return {
    start(){ if (running) return; running = true; resize(); requestAnimationFrame(loop); },
    stop(){ running = false; }
  };
})();

/* ---------- the game ---------- */
const Game = (() => {
  const wrap = $('#gameWrap'), cv = $('#game'), ctx = cv.getContext('2d');
  const cap = $('#cap'), hud = $('#hud'), reveal = $('#reveal'), after = $('#after'), skipBtn = $('#skipBtn');
  const BLUE = '#0000ff', WHITE = '#ffffff';
  let INK = BLUE, PAPER = WHITE;
  function invert(on){ INK = on ? WHITE : BLUE; PAPER = on ? BLUE : WHITE; }
  const G = 800;
  const T = { ascend: 1.6, ascendEnd: 9.6, zoom: 18.4, zoomEnd: 21.4 };
  let cw, ch, dpr, s, VW, VH, L = {}, cam = { x:0, y:0, zoom:1, rot:0 };
  let me, them, st, raf = 0, last = 0, stars = [], clouds = [], tOverride = null;

  const QUIPS = [
    'Not quite. The target is fine, thanks for asking.',
    'That one is in Wales now.'
  ];
  const EASIER = 'YOU SUCK. WE HAVE TO MAKE THIS EASIER FOR YOU.';

  function layout(){
    cw = innerWidth; ch = innerHeight; dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    const tall = cw < ch;
    s = Math.min(cw / (tall ? 660 : 1000), ch / 650);
    VW = cw / s; VH = ch / s;
    L.B = Math.max(170, VW * .16);
    L.tx0 = VW - (tall ? 200 : 270); L.ty = 120; L.R0 = 44;
    L.gOff = tall ? 100 : 135; L.sOff = tall ? 175 : 225;
    L.groundCy = (tall ? .22 : .36) * VH;
    L.landX = VW * .26; L.treeX = VW * .52; L.flagX = VW * .72; L.lmX = VW * .87;
    L.D = L.tx0 - (L.B + 30);
  }

  /* -------- state -------- */
  function newState(){
    return { mode:'aim', arrows:[], cur:null, misses:0, t0:0, drag:null, aimA:.55, power:0, hit:null, quipT:0 };
  }
  function tx(){ const k = Math.max(0, st.misses - 2); return L.tx0 - Math.min(k, 9) * .055 * L.D; }
  function R(){ return L.R0 * Math.min(1.75, 1 + .08 * Math.max(0, st.misses - 2)); }
  function seqT(now){ return tOverride != null ? tOverride : (now - st.t0) / 1000; }

  function setCap(text){ if (cap.textContent !== text) cap.textContent = text; }
  function setHud(parts){
    const html = parts.map(p => `<span class="${p[1]||''}">${p[0]}</span>`).join('');
    if (hud.innerHTML !== html) hud.innerHTML = html;
  }

  /* -------- input -------- */
  function pdown(e){
    if (st.mode !== 'aim') return;
    cv.setPointerCapture(e.pointerId);
    st.drag = { x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY };
    aimFromDrag();
  }
  function pmove(e){ if (!st.drag) return; st.drag.x = e.clientX; st.drag.y = e.clientY; aimFromDrag(); }
  function pup(){
    if (!st.drag) return;
    st.drag = null;
    if (st.power < .06){ st.power = 0; return; }
    fire(st.aimA, st.power);
  }
  function aimFromDrag(){
    const d = st.drag;
    let dx = d.x0 - d.x, dy = d.y0 - d.y;
    if (dx < 0){ dx = -dx; dy = -dy; }   // dragged towards the target: treat it as pointing
    const len = Math.hypot(dx, dy), max = Math.max(110, .3 * Math.min(cw, ch));
    if (len > 4) st.aimA = clamp(Math.atan2(-dy, dx), -.25, 1.45);
    st.power = clamp(len / max);
  }
  function launchPt(){ return { x: L.B + 30, y: 92 }; }
  function fire(a, p){
    const v = p * Math.sqrt(1.4 * L.D * G), o = launchPt();
    st.cur = { x: o.x + Math.cos(a) * 34, y: o.y + Math.sin(a) * 34, vx: Math.cos(a) * v, vy: Math.sin(a) * v, a };
    st.mode = 'fly'; st.power = 0; setCap('');
  }

  /* -------- physics -------- */
  function update(dt, now){

  /* -------- moon scene: arrival, landing, the tree, the bauble -------- */

      const lx = L.lmX;
      line([lx - 36, 46, lx - 62, 4]); line([lx + 36, 46, lx + 62, 4]); line([lx - 20, 40, lx - 30, 4]); line([lx + 20, 40, lx + 30, 4]);
      ell(lx - 66, 3, 12, 3, PAPER); ell(lx + 66, 3, 12, 3, PAPER);
      ctx.beginPath(); ctx.moveTo(lx - 46, 40); ctx.lineTo(lx + 46, 40); ctx.lineTo(lx + 38, 96); ctx.lineTo(lx - 38, 96); ctx.closePath(); ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
      ctx.lineWidth = px(1); for (let i = -30; i <= 30; i += 15) line([lx + i, 44, lx + i * .85, 92]); ctx.lineWidth = px(2.2);
      line([lx - 30, 40, lx - 30, 8]); for (let yy = 12; yy < 40; yy += 7) line([lx - 36, yy, lx - 24, yy]);
      ctx.fillStyle = INK; ctx.fillRect(lx - 14, 18, 28, 8);

      // the flag
      const fx = L.flagX;
      line([fx, 0, fx, 170]); line([fx, 166, fx + 74, 166]);
      ctx.fillStyle = PAPER; ctx.fillRect(fx, 120, 74, 46); ctx.strokeRect(fx, 120, 74, 46);
      ctx.fillStyle = INK; for (let i = 0; i < 7; i += 2) ctx.fillRect(fx, 120 + i * 46 / 7, 74, 46 / 7);
      ctx.fillRect(fx, 140, 30, 26);
      ctx.fillStyle = PAPER; for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) ctx.fillRect(fx + 5 + i * 9, 146 + j * 9, 2.5, 2.5);
      ctx.fillStyle = PAPER; ctx.fillRect(fx + 22, 0, 30, 16); ctx.strokeStyle = INK; ctx.strokeRect(fx + 22, 0, 30, 16); line([fx + 27, 6, fx + 47, 6]); line([fx + 27, 10, fx + 41, 10]);

      // the tree
      drawTree(L.treeX, t);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    LW = 1; ctx.lineWidth = px(2.2);

    // the balloon: upright at first, then flipped so the basket meets the Moon
    ctx.save();
    ctx.translate(P.x, P.y); ctx.rotate(flip); ctx.translate(-P.x, -P.y);
    drawBalloon(L.landX, my, { defl, bow: false });
    ctx.restore();
    // dust
    if (tm > TD - .05 && tm < TD + 1.6){
      const d = clamp((tm - TD + .05) / 1.4);
      ctx.globalAlpha = 1 - d;
      for (let i = 0; i < 9; i++){ const an = Math.PI * (i / 8); circ(L.landX + Math.cos(an) * (40 + d * 120), 4 + Math.sin(an) * d * 40, 5 + d * 10, PAPER); }
      ctx.globalAlpha = 1;
    }

    const caps = [[.2, "That's the Moon."], [1.0, 'Turning round to park.'], [TD + .1, 'Space is confusing. Up is down now.'], [TD + 2.4, 'Tranquility Base. Apollo 11 parked here in 1969.'], [TD + 3.7, 'Someone has put a tree up.'], [TD + 4.8, 'Look closer.'], [TD + 7.5, '']];
    let c = ''; for (const [tt, txt] of caps) if (tm >= tt) c = txt; setCap(c);
    setHud(t < T.zoom ? [['Altitude 384,400 km', 'solid']] : []);

    if (t >= T.zoomEnd && st.mode !== 'done') finish();
  }

  function drawTree(x, t){
    ctx.strokeStyle = INK;
    ctx.fillStyle = INK; ctx.fillRect(x - 10, 0, 20, 24); ctx.strokeRect(x - 10, 0, 20, 24);
    const tiers = [[24, 96, 92], [94, 76, 82], [158, 54, 72]];
    for (const [b, w, h] of tiers){
      ctx.beginPath(); ctx.moveTo(x - w, b); ctx.lineTo(x, b + h); ctx.lineTo(x + w, b); ctx.closePath(); ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
    }
    ctx.lineWidth = px(1.2);
    ctx.beginPath(); ctx.moveTo(x - 80, 44); ctx.quadraticCurveTo(x, 20, x + 76, 60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 60, 112); ctx.quadraticCurveTo(x, 92, x + 56, 128); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 40, 172); ctx.quadraticCurveTo(x, 160, x + 36, 190); ctx.stroke();
    ctx.lineWidth = px(2.2);
    // star
    ctx.beginPath();
    for (let i = 0; i < 10; i++){ const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? 7 : 16; ctx.lineTo(x + Math.cos(a) * rr, 242 + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    // baubles
    for (const [bx, by, br] of [[-62, 40, 8], [-20, 58, 9], [46, 46, 8], [-40, 110, 8], [10, 140, 8], [-14, 176, 7], [24, 190, 6], [70, 36, 7]]) circ(x + bx, by, br, INK);
    // the bauble
    const Q = bauble();
    line([Q.x, Q.y + Q.r, Q.x, Q.y + Q.r + 7]);
    ctx.fillStyle = PAPER; ctx.fillRect(Q.x - 3.5, Q.y + Q.r - 1, 7, 4); ctx.strokeRect(Q.x - 3.5, Q.y + Q.r - 1, 7, 4);
    circ(Q.x, Q.y, Q.r, INK);
    ctx.save(); ctx.strokeStyle = PAPER; ctx.lineWidth = px(1.2) * Math.min(cam.zoom, 6); ctx.beginPath(); ctx.arc(Q.x, Q.y, Q.r * .74, 2.0, 2.6); ctx.stroke(); ctx.restore();
    if (t < T.zoom){ const p = .5 + .5 * Math.sin(t * 5); ctx.globalAlpha = p; circ(Q.x, Q.y, Q.r + 5, null); ctx.globalAlpha = 1; }
  }

  /* -------- loop -------- */
  function frame(now){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.033, (now - (last || now)) / 1000); last = now;
    if (st.mode === 'wait' && now > st.quipT) st.mode = 'aim';
    update(dt, now);
    const t = (st.mode === 'seq' || st.mode === 'done') ? seqT(now) : 0;
    if (t < T.ascendEnd) renderGround(t, now); else renderMoon(t);
    skipBtn.hidden = !(st.mode === 'seq' && st.replay && t < T.zoom - .5);
  }

  function finish(){
    st.mode = 'done';
    $('#rName').textContent = me + ',';
    $('#rThem').textContent = them;
    reveal.classList.add('on'); after.classList.add('on');
    setCap(''); setHud([]);
  }

  function seed(){
    stars = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), v: .3 + Math.random(), r: Math.random() < .15 ? 2.2 : 1.2 }));
    let r = 7; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
    clouds = Array.from({ length: 16 }, (_, i) => ({ x: L.B - 500 + rnd() * 1100, y: 700 + i * 210 + rnd() * 90, k: .7 + rnd() * .9 }));
  }

  function open(name, opts = {}){
    me = name; them = drawFor(name);
    wrap.hidden = false; $('#ctrls').hidden = true; $('#closeBtn').hidden = false;
    reveal.classList.remove('on'); after.classList.remove('on');
    layout(); seed();
    st = newState(); st.replay = !!store.get('sss-played-' + name);
    tOverride = null;
    if (opts.straightToBauble){ st.mode = 'seq'; st.t0 = performance.now() - T.zoomEnd * 1000; st.hit = { ly: L.ty, a: .1 }; }
    cancelAnimationFrame(raf); last = 0; raf = requestAnimationFrame(frame);
  }
  function close(){
    cancelAnimationFrame(raf); wrap.hidden = true; $('#ctrls').hidden = false; $('#closeBtn').hidden = true;
  }

  cv.addEventListener('pointerdown', pdown);
  cv.addEventListener('pointermove', pmove);
  cv.addEventListener('pointerup', pup);
  cv.addEventListener('pointercancel', pup);
  addEventListener('resize', () => { if (!wrap.hidden) { layout(); seed(); } });
  skipBtn.onclick = () => { st.t0 = performance.now() - T.ascendEnd * 1000; };
  $('#replayBtn').onclick = () => { reveal.classList.remove('on'); after.classList.remove('on'); st.mode = 'seq'; st.replay = true; st.t0 = performance.now(); };

  // test hooks
  window.__ss = { open, fire, jump(t){ st.mode = 'seq'; st.hit = st.hit || { ly: L.ty, a: .1 }; st.t0 = performance.now() - t * 1000; }, state: () => st };
  return { open, close, get open_(){ return !wrap.hidden } };
})();

/* ---------- the draw page ---------- */
(() => {
  const names = $('#names');
  PEOPLE.forEach((p, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="mono">${String(i + 1).padStart(2, '0')}</span><span class="n wide"></span>`;
    b.querySelector('.n').textContent = p;
    b.onclick = () => choose(p);
    names.appendChild(b);
  });
  function choose(p){
    store.set('sss-me', p);
    if (store.get('sss-played-' + p)){
      $('#pick').hidden = true; $('#again').hidden = false;
      $('#againTitle').textContent = `Hello again, ${p}.`;
      $('#againName').textContent = p;
    } else Game.open(p);
  }
  $('#againShow').onclick = () => Game.open(store.get('sss-me'), { straightToBauble: true });
  $('#againPlay').onclick = () => Game.open(store.get('sss-me'));
  $('#againNot').onclick = () => { store.del('sss-me'); $('#again').hidden = true; $('#pick').hidden = false; };
  $('#closeBtn').onclick = () => { Game.close(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#gameWrap').hidden) Game.close(); });
})();

/* ---------- the lists ---------- */
const Lists = (() => {
  const grid = $('#grid'), status = $('#status');
  const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
  let rows = [], live = false;
  const local = {
    all(){ try { return JSON.parse(store.get('sss-wishes') || '[]') } catch(e){ return [] } },
    save(r){ store.set('sss-wishes', JSON.stringify(r)); }
  };

  // turn web addresses into links, built from DOM nodes so nothing typed is run as HTML
  function linkify(el, text){
    const re = /\b((?:https?:\/\/|www\.)[^\s<>"]+[^\s<>".,;:!?)\]])/gi;
    let last = 0, m;
    while ((m = re.exec(text))){
      if (m.index > last) el.append(text.slice(last, m.index));
      const href = /^https?:/i.test(m[1]) ? m[1] : 'https://' + m[1];
      let label = m[1];
      try { const u = new URL(href); label = u.hostname.replace(/^www\./, '') + (u.pathname.length > 1 || u.search ? '/…' : ''); } catch(e){ continue; }
      const a = document.createElement('a');
      a.href = href; a.textContent = label; a.target = '_blank'; a.rel = 'noopener noreferrer';
      el.append(a); last = m.index + m[1].length;
    }
    if (last < text.length) el.append(text.slice(last));
  }

  function build(){
    grid.innerHTML = '';
    PEOPLE.forEach((p, i) => {
      const card = document.createElement('article'); card.className = 'card'; card.dataset.person = p;
      card.innerHTML = `<header><h2 class="wide"></h2><span class="mono count"></span></header><ul></ul>
        <form autocomplete="off"><input maxlength="280" aria-label=""><button type="submit">Add</button></form>`;
      card.querySelector('h2').textContent = p;
      const input = card.querySelector('input');
      input.placeholder = `Add something to ${p}'s list`;
      input.setAttribute('aria-label', `Add something to ${p}'s list`);
      card.querySelector('form').onsubmit = e => { e.preventDefault(); const v = input.value.trim(); if (!v) return; input.value = ''; add(p, v); };
      grid.appendChild(card);
    });
  }

  function render(){
    for (const card of grid.children){
      const p = card.dataset.person, ol = card.querySelector('ul');
      const mine = rows.filter(r => r.person === p);
      card.querySelector('.count').textContent = mine.length ? `${mine.length} thing${mine.length > 1 ? 's' : ''}` : '';
      ol.innerHTML = '';
      if (!mine.length){ const li = document.createElement('li'); li.className = 'empty'; li.style.display = 'block'; li.textContent = 'Nothing yet. Suspicious.'; ol.appendChild(li); }
      mine.forEach((r, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="t"></span><button class="x" title="Remove">×</button>`;
        linkify(li.querySelector('.t'), r.body);
        li.querySelector('.x').onclick = () => { if (confirm(`Remove "${r.body}" from ${p}'s list?`)) remove(r.id); };
        ol.appendChild(li);
      });
    }
  }

  async function load(){
    if (!sb){ rows = local.all(); render(); return; }
    const { data, error } = await sb.from(TABLE).select('id,person,body,created_at').order('created_at', { ascending: true }).order('id', { ascending: true });
    if (error){ status.textContent = 'Could not load the lists. Try refreshing.'; return; }
    rows = data; render();
  }
  async function add(person, body){
    if (!sb){ const r = local.all(); r.push({ id: Date.now(), person, body }); local.save(r); return load(); }
    rows.push({ id: 'tmp' + Date.now(), person, body }); render();
    const { error } = await sb.from(TABLE).insert({ person, body });
    if (error) status.textContent = 'That did not save. Try again.';
    load();
  }
  async function remove(id){
    if (!sb){ local.save(local.all().filter(r => r.id !== id)); return load(); }
    rows = rows.filter(r => r.id !== id); render();
    const { error } = await sb.from(TABLE).delete().eq('id', id);
    if (error) status.textContent = 'That did not delete. Try again.';
    load();
  }

  build();
  status.textContent = sb ? '' : 'The lists aren\'t shared yet, so only you can see what you add.';
  return {
    show(){
      load();
      if (sb && !live){
        live = true;
        sb.channel(TABLE).on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => load()).subscribe();
      }
    }
  };
})();

/* ---------- routing ---------- */
function route(){
  const r = (location.hash.replace(/^#\/?/, '') || 'home').split('/')[0];
  const view = ['home', 'draw', 'lists'].includes(r) ? r : 'home';
  document.querySelectorAll('[data-view]').forEach(v => v.hidden = v.dataset.view !== view);
  if (view !== 'draw' && !$('#gameWrap').hidden) Game.close();
  if (view === 'home') Field.start(); else Field.stop();
  $('#glyphBtn').hidden = $('#pauseBtn').hidden = view !== 'home';
  if (view === 'draw'){ $('#again').hidden = true; $('#pick').hidden = false; }
  if (view === 'lists') Lists.show();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
